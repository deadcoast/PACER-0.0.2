[project]
name = "pacer"
version = "0.1.0"
description = "PACER development workspace"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mypy>=2.3.1",
    "pacer-mcp",
]

[dependency-groups]
# Match the plugin's default group; uv selects groups per project during sync.
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "pyyaml>=6,<7"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["plugins/pacer"]

[tool.uv.sources]
pacer-mcp = { workspace = true }
