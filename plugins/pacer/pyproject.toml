[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pacer"
version = "3.1.0"
description = "PACER: project context delivered to coding agents as bounded cards"
readme = "README.md"
requires-python = ">=3.11"
# The runtime (registers, compiler, hooks, CLI) uses the standard library only.
# `mcp` is needed by `pacer serve` alone.
dependencies = ["mcp>=1.12.4,<2"]

[project.scripts]
pacer = "pacer.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.15,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/pacer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/pacer"]
check_untyped_defs = true
warn_unused_ignores = true
