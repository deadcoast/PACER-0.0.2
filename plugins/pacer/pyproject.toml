[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pacer-mcp"
version = "3.0.0"
description = "PACER 3: hook-delivered project context over five CSV registers"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12.4,<2", "filelock>=3.18,<4"]

[project.scripts]
pacer = "pacer_mcp.cli:main"

[dependency-groups]
# Match the workspace root so syncing either project retains the same tools.
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "pyyaml>=6,<7", "types-pyyaml>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/pacer_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E501"]
